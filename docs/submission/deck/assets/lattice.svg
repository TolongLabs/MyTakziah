<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Songket-style eight-point lattice. The star is the classic pair of
       overlapping squares, one rotated 45 degrees. Quarter stars sit on every
       corner so the tile repeats seamlessly in both directions. Geometry only:
       no crescent, no calligraphy, no arch. -->
  <defs>
    <g id="star8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
      <rect x="-42" y="-42" width="84" height="84"/>
      <rect x="-42" y="-42" width="84" height="84" transform="rotate(45)"/>
      <rect x="-21" y="-21" width="42" height="42" transform="rotate(22.5)"/>
    </g>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <path d="M0 120 H240 M120 0 V240"/>
    <path d="M0 0 L240 240 M240 0 L0 240"/>
  </g>
  <use href="#star8" x="120" y="120"/>
  <use href="#star8" x="0"   y="0"/>
  <use href="#star8" x="240" y="0"/>
  <use href="#star8" x="0"   y="240"/>
  <use href="#star8" x="240" y="240"/>
</svg>
